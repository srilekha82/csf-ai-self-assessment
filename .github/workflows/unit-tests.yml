# Runs the unit tests (tests/test_*.py) on every pull request and every push to main.
# The data checks (tests/check_*.py) are not run here: they test the committed banks and run at the end-to-end step.
name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
